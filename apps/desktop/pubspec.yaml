name: obsidian_flm_desktop
description: Local-first desktop client for Obsidian_FLM.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"
dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  # No third-party graph-drawing package: the knowledge graph is drawn with
  # a hand-rolled canvas (Stack/Positioned/CustomPaint) in
  # lib/features/knowledge_graph/presentation/widgets/concept_graph_canvas.dart.
  # A `graphview: ^1.5.1` dependency lived here through "Lần 4" of that
  # feature; see its README.md "Lần 5" for why it was dropped.
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - data/
    - data/subject/
    - data/concepts/
